<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trafikklys</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        background-color: #2c3e50;
        font-family: Arial, sans-serif;
      }

      .mainDiv {
        background-color: #1a1a1a;
        border-radius: 20px;
        padding: 20px;
        width: 80px;
        height: 220px;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .mainDiv > div {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #333;
      }

      .mainDiv > div.red {
        background-color: red;
      }
      .mainDiv > div.yellow {
        background-color: yellow;
      }
      .mainDiv > div.green {
        background-color: green;
      }
      .mainDiv > div.gray {
        background-color: #333;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      .buttons button {
        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background-color: #ecf0f1;
        cursor: pointer;
      }

      .buttons button:hover {
        background-color: #bdc3c7;
      }
    </style>
  </head>
  <body>
    <div class="mainDiv" id="app"></div>

    <div class="buttons">
      <button onclick="changePhase()">Next</button>
    </div>

    <script>
      //Model
      let phase = 0;


      //View
      function updateView() {
        let color1 = "gray";
        let color2 = "gray";
        let color3 = "gray";

        if (phase == 0) {
          color1 = "red";
        }
        if (phase == 1) {
          color1 = "red";
          color2 = "yellow";
        }
        if (phase == 2) {
          color3 = "green";
        }
        if (phase == 3) {
          color2 = "yellow";
        }
        document.getElementById("app").innerHTML = /*HTML*/ `
          <div class="${color1}"></div>
          <div class="${color2}"></div>
          <div class="${color3}"></div>
        `;
      }


      //Controller
      function changePhase() {
        phase++;
        if (phase > 3) {
          phase = 0;
        }
        updateView();
      }

      updateView();
    </script>
  </body>
</html>
