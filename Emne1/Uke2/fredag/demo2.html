<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <input type="text" oninput="getName(this.value)" />
      <p id="output">
      </p>
    </div>
  </body>
  <script>

    function getName(name){
        document.getElementById("output").innerText = `Hei ${name}`
    }

  </script>
</html>
