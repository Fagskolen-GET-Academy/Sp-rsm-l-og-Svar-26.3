<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekstverktøy</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 60px;
        background-color: #f0f4f8;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #app {
        background: white;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        width: 400px;
      }

      h1 {
        margin-top: 0;
        font-size: 22px;
        color: #005f99;
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 10px 12px;
        border: 2px solid #ccc;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #005f99;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        font-size: 15px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background-color: #005f99;
        color: white;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #00456e;
      }

      .result {
        margin-top: 20px;
        padding: 16px;
        background: #f0f4f8;
        border-radius: 8px;
        font-size: 18px;
        min-height: 24px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const app = document.getElementById("app");

      function updateView() {
        app.innerHTML = /*HTML*/ `
          <h1>Tekstverktøy</h1>
          <input type="text" placeholder="Skriv inn tekst" />
          <div class="buttons">
            <button>Reverser tekst</button>
          </div>
          <div class="result"></div>
        `;
      }

      updateView();
    </script>
  </body>
</html>
