      const prices = [249, 149, 599, 199, 649, 59, 49];

      // En liste med strenger

        "Elden Ring",

      // filter: beholder alle prisene under 200 → ny array [149, 199, 59]
      const cheap = prices.filter((elem) => elem < 200);

      // map: ny array der hver pris har fått 25 % mva → samme lengde som prices
      const withVat = prices.map((elem) => elem * 1.25);

      // find: returnerer FØRSTE pris under 100 (ett tall, ikke en array) → 59
      const firstCheap = prices.find((elem) => elem < 100);

      // find: returnerer FØRSTE tittel lengre enn 10 tegn → "Stardew Valley"
      const longestName = games.find((elem) => elem.length > 10);

      // some: er MINST ÉN pris over 500? → true/false (boolean)
      const hasExpensiveGame = prices.some((elem) => elem > 500);

      // every: er ALLE prisene over 50? → true/false (boolean)
      const allOver50 = prices.every((elem) => elem > 50);

      // kjede: behold titler lengre enn 6 tegn, gjør dem så til STORE bokstaver → ny array
      const featured = games
        .filter((game) => game.length > 6)
        .map((game) => game.toUpperCase());

      // map + join: gjør hver tittel til <li>…</li> og slå dem sammen til én streng
      let html = games.map((elem) => `<li>${elem}</li>`).join(" ");
