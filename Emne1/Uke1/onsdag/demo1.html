<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      div {
        width: 400px;
        height: 400px;
      }

      .redBackground {
        background-color: red;
      }

      #backgroundPink {
        background-color: pink;
      }

      #mainDiv {
        height: 500px;
        width: 500px;
        display: flex;
        justify-content: space-evenly;
      }

      .box {
        background-color: blue;
        border: 1px black solid;
        height: 30%;
      }
    </style>
  </head>
  <body>
    <div id="mainDiv" class="redBackground">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
