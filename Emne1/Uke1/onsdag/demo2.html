<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .mainDiv{
            background-color: black;
            border-radius: 30%;
            height: 100px;
            width: 40px;
            color: whitesmoke;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            
        }

        .redLight{
            background-color: red;
            width:25px;
            height: 25px;
            border-radius: 100%;
        }

        .yellowLight{
            background-color: yellow;
            width: 25px;
            height: 25px;
            border-radius: 100%;
        }

        .grayLight{
            background-color: gray;
            width: 25px;
            height: 25px;
            border-radius: 100%;
        }
    </style>
  </head>
  <body>
    <div class="mainDiv">
        <div class="redLight"></div>
        <div class="yellowLight"></div>
        <div class="grayLight"></div>
    </div>
  </body>
</html>
