<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .ageQuestion {
        font-family: sans-serif;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ageInput {
        width: 60px;
        padding: 4px 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .studentCheckbox {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .studentLabel {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      let mainDiv = document.getElementById("app");
      let age = null;
      let isStudent = false;
      let message = "";

      //hvis alder er mindre enn 16 => barne bilett
      //hvis alder er storre enn 60 => honnor bilett
      //hvis alder er storre enn 16 => voksen billet
      //hvis alder er storre enn 16 og student => student bilett

      function updateView() {
        mainDiv.innerHTML = /*HTML*/ `
            <p class="ageQuestion">
            jeg er
            <input type="number" value="${age}" class="ageInput" oninput="age=this.value" />
            år gammel
            <input type="checkbox" onchange="isStudent=this.checked" id="student" name="student" class="studentCheckbox" />
            <label for="student" class="studentLabel">Student</label>
            </p>
            <p>${message}</p>
            <button onclick="buyTicket()">Kjøp billet</button>`;
      }

      function buyTicket() {
        if (age <= 16) message = "Barne bilett";
        else if (age >= 60) message = "Honnor bilett";
        else if (age > 16 && isStudent) message = "Student bilett";
        else message = "Voksen billett";
        updateView();
      }

      updateView();
    </script>
  </body>
</html>
